services:
  - type: web
    name: ai-security-triage
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ACCESS_USERNAME
        value: analyst
      - key: APP_ACCESS_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: REVIEW_CONFIDENCE_THRESHOLD
        value: "0.72"
      - key: EVIDENCE_CONFIDENCE_THRESHOLD
        value: "0.65"
