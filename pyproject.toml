[project]
name = "ai-security-triage"
version = "1.1.1"
description = "Review-first AI-assisted security report triage"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "requests>=2.32,<3.0",
  "python-dotenv>=1.0,<2.0",
  "jinja2>=3.1,<4.0",
  "pydantic>=2.8,<3.0",
]

[project.optional-dependencies]
test = [
  "pytest>=9.0.3,<10.0",
  "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
